name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff pyinstaller

    - name: Lint with Ruff
      run: |
        ruff check .
        
    - name: Test with pytest
      run: |
        pytest tests/ --cov=src --cov-report=xml --cov-fail-under=80
        
    - name: Build executable (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --name shadow-sort-windows --onefile src/cli.py
        
    - name: Build executable (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pyinstaller --name shadow-sort-linux --onefile src/cli.py
        
    - name: Build executable (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --name shadow-sort-macos --onefile src/cli.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: shadow-sort-${{ matrix.os }}
        path: dist/shadow-sort-*
